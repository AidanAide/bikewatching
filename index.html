<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bikewatching</title>

    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="map.css">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <script src="map.js" type="module"></script>

    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css">

</head>
<body>
    <header>
        <h1>🚴🏼‍♀️ Bikewatching</h1>
        <label class="time-filter" for="time-slider">
            <span>Filter by time:</span>
            <input id="time-slider" type="range" min="-1" max="1440" value="-1" step="1">
            <span class="time-filter__value">
                <time id="selected-time"></time>
                <em id="any-time">(any time)</em>
            </span>
        </label>
    </header>
    <div id="map">
        <svg></svg>
    </div>
    <div class="legend">
        <div style="--departure-ratio: 1">More departures</div>
        <div style="--departure-ratio: 0.5">Balanced</div>
        <div style="--departure-ratio: 0">More arrivals</div>
    </div>
</body>
</html>
